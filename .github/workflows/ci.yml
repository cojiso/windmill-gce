# Renovate merges only after this passes, so it is the gate for every automatic update.
# It deploys nothing: the VM pulls main every night (configs/update.sh), and Pulumi changes go out when you run pulumi up.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pulumi:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pulumi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pulumi/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit

  configs:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: configs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck -x -P SCRIPTDIR *.sh
      - name: compose config, every profile
        run: |
          cp .env.example .env
          for p in caddy tunnel; do COMPOSE_PROFILES=$p docker compose config --quiet; done
      # Whether the new Windmill actually works cannot be checked here. The snapshot taken before every nightly update, and the failure alerts, cover that.
      - name: images exist
        run: COMPOSE_PROFILES=caddy,tunnel docker compose pull --quiet
